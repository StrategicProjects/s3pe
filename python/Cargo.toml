[package]
name = "s3pe-py"
version = "0.2.0"
edition = "2021"
description = "Python bindings of the s3pe crate"
license = "MIT"
repository = "https://github.com/StrategicProjects/s3pe"
publish = false

[lib]
name = "_s3pe"
crate-type = ["cdylib"]

[dependencies]
s3pe = { path = "../rust", default-features = false }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[profile.release]
lto = "fat"
codegen-units = 1
