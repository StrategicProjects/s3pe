<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>What happens in every s3pe call</title>
  <desc>Six steps from left to right: resolve the key (s3://bucket/key, or bucket plus key, or the default bucket); hash the payload (SHA-256 for the signature, MD5 for the check); sign with AWS Signature V4 over host, x-amz-date and x-amz-content-sha256; send a PUT, GET, HEAD or DELETE with Content-Length, path-style; retry on connection failure or HTTP 429 and 5xx after 1 s and 2 s, never on other 4xx; verify the ETag against the MD5 and the Content-Length, then print one log line. Below, the typed errors: 404 not found, 403 access denied, other HTTP with the S3 code, transport, configuration, integrity.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56648a"/>
    </marker>
    <style>
      .step { fill: #ffffff; stroke: #c3cde6; stroke-width: 1.5; rx: 12; }
      .n { fill: #29c7ac; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 800; font-size: 11px; }
      .t { fill: #10192e; font-weight: 700; font-size: 14px; }
      .s { fill: #56648a; font-size: 11px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #10192e; }
      .line { stroke: #56648a; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
      .loop { stroke: #ffb14e; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); stroke-dasharray: 5 4; }
      .err { fill: #fff3f2; stroke: #ff8a80; stroke-width: 1.5; rx: 12; }
      .ok { fill: #e6f7f3; stroke: #29c7ac; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <!-- six boxes of 148 px, 12 px apart -->
  <g>
    <rect class="step" x="10" y="28" width="148" height="122"/>
    <text class="n" x="22" y="50">01</text>
    <text class="t" x="22" y="72">Resolve</text>
    <text class="s" x="22" y="94">s3://bucket/key,</text>
    <text class="s" x="22" y="111">bucket= and key, or</text>
    <text class="s" x="22" y="128">the default bucket</text>

    <rect class="step" x="170" y="28" width="148" height="122"/>
    <text class="n" x="182" y="50">02</text>
    <text class="t" x="182" y="72">Hash</text>
    <text class="s" x="182" y="94">SHA-256 of the body</text>
    <text class="s" x="182" y="111">for the signature,</text>
    <text class="s" x="182" y="128">MD5 for the check</text>

    <rect class="step" x="330" y="28" width="148" height="122"/>
    <text class="n" x="342" y="50">03</text>
    <text class="t" x="342" y="72">Sign</text>
    <text class="s" x="342" y="94">AWS SigV4 over host,</text>
    <text class="s" x="342" y="111">x-amz-date and the</text>
    <text class="s" x="342" y="128">payload hash</text>

    <rect class="step" x="490" y="28" width="148" height="122"/>
    <text class="n" x="502" y="50">04</text>
    <text class="t" x="502" y="72">Send</text>
    <text class="s" x="502" y="94">PUT, GET, HEAD or</text>
    <text class="s" x="502" y="111">DELETE; path-style,</text>
    <text class="s" x="502" y="128">Content-Length set</text>

    <rect class="step" x="650" y="28" width="148" height="122"/>
    <text class="n" x="662" y="50">05</text>
    <text class="t" x="662" y="72">Retry</text>
    <text class="s" x="662" y="94">connection failures</text>
    <text class="s" x="662" y="111">and HTTP 429, 5xx:</text>
    <text class="s" x="662" y="128">3 tries, 1 s then 2 s</text>

    <rect class="step" x="810" y="28" width="140" height="122"/>
    <text class="n" x="822" y="50">06</text>
    <text class="t" x="822" y="72">Verify</text>
    <text class="s" x="822" y="94">ETag = MD5 on PUT,</text>
    <text class="s" x="822" y="111">Content-Length and</text>
    <text class="s" x="822" y="128">MD5 on GET</text>
  </g>

  <path class="line" d="M158,89 L168,89"/>
  <path class="line" d="M318,89 L328,89"/>
  <path class="line" d="M478,89 L488,89"/>
  <path class="line" d="M638,89 L648,89"/>
  <path class="line" d="M798,89 L808,89"/>
  <!-- retry loop back to send -->
  <path class="loop" d="M724,150 C724,190 564,190 564,152"/>
  <text class="s" x="644" y="203" text-anchor="middle" fill="#b8791c">signed again, with a fresh date</text>

  <!-- outcomes -->
  <rect class="ok" x="10" y="230" width="460" height="105"/>
  <text class="t" x="26" y="254">Success</text>
  <text class="s" x="26" y="272">The object, the file or the listing, and one line on stderr:</text>
  <g class="mono">
    <text x="26" y="296">↑ s3://iaempe/etl/painel.parquet (12.3 MB, 0.8 s)</text>
    <text x="26" y="316">✔ 31 objects under s3://iaempe/dados/ (0.2 s)</text>
  </g>

  <rect class="err" x="490" y="230" width="460" height="105"/>
  <text class="t" x="506" y="254">Typed errors, raised at once</text>
  <text class="s" x="506" y="272">404 not found (exists_s3 gives FALSE) · 403 access denied</text>
  <text class="s" x="506" y="290">other HTTP, with the S3 code · transport, after the retries</text>
  <text class="s" x="506" y="308">configuration (no credentials, no bucket) · integrity</text>
  <text class="s" x="506" y="326">No retry on 4xx: those are the caller's to fix.</text>
</svg>
