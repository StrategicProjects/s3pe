url: https://strategicprojects.github.io/s3pe/r/

template:
  package: tidytemplate
  bootstrap: 5
  bslib:
    primary: "#1f5aa8"

home:
  title: s3pe — a small, dependable S3 client for R
  description: >
    Read and write data on any S3-compatible object store with signed,
    retried and verified requests. The format follows the file extension.

navbar:
  structure:
    right: [search, github, editions]
  components:
    editions:
      text: Other editions
      menu:
      - text: All editions
        href: https://strategicprojects.github.io/s3pe/
      - text: Python
        href: https://strategicprojects.github.io/s3pe/python/
      - text: Rust
        href: https://strategicprojects.github.io/s3pe/rust/
      - text: Go
        href: https://strategicprojects.github.io/s3pe/go/

reference:
- title: Read and write
  desc: R objects in, R objects out. The format follows the key's extension.
  contents:
  - read_s3
  - write_s3
- title: Files
  contents:
  - download_s3
  - upload_s3
- title: Bucket operations
  contents:
  - list_s3
  - head_s3
  - exists_s3
  - buckets_s3
- title: Copy, delete and sync
  contents:
  - copy_s3
  - delete_s3
  - sync_up_s3
- title: Sharing
  contents:
  - presign_s3
- title: Configuration
  contents:
  - s3_config
  - use_bucket
  - s3pe-package

articles:
- title: Get started
  navbar: ~
  contents:
  - s3pe

news:
  releases: []
